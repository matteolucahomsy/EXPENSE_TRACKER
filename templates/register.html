<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="bg-light">
    <div class="card shadow-sm mx-auto p-4" style="max-width:400px;">
        <h2 class="text-center mb-4">
            Register
        </h2>
        {% if error %}
        <div class="alert alert-danger text-center">
            {{  error  }}
        </div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="Username" value="{{ request.form.username }}" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
            <button class="btn btn-succes w-100">
                Register
            </button>
        </form>
        <p class="text-cenetr mt-3">
            Already gave an account?
            <a href="/login">Login</a>
        </p>

    </div>
</div>   
</body>
</html>
