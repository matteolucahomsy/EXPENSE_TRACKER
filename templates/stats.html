<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics</title>
</head>
<body>
    <h1>Expense Statistics</h1>
    {% if data %}
        <ul>
        {% for item in data %}
            <li>{{  item[0]  }} : ${{  item[1]  }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No data available</p>
    {% endif %}

</body>
</html>
